name: full
# The full test (PRD section 11): a real Paperless-ngx 3.3.3 in Docker, the made-up kit uploaded
# as phone scans, the Clerk against a pretend Google Drive with recorded AI answers.
# On a push to main, on version tags and by hand only (it takes a quarter of an hour of paid
# minutes); a newer push cancels the run of an older one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: The Godspeed product, for its notebook
        uses: actions/checkout@v4
        with:
          repository: MichaelZelbel/godspeed-mission-control
          path: product
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start Paperless-ngx 3.3.3
        run: docker compose -f test/full/compose.yaml up -d
      - name: Render the made-up kit as scans
        run: |
          python3 -m pip install --quiet pillow
          python3 test/kit/render.py test/kit/rendered
      - name: The full test
        run: node test/full/full.mjs
        env:
          PAPERLESS_URL: http://127.0.0.1:8000
          KIT_RENDERED: test/kit/rendered
          GODSPEED_NOTEBOOK_CHECKOUT: product
      - name: What Paperless said, when it failed
        if: failure()
        run: docker compose -f test/full/compose.yaml logs --tail 200 webserver
      - name: Stop Paperless
        if: always()
        run: docker compose -f test/full/compose.yaml down -v
